const page = $("#player"), layout = $(".layout");
const TITLE = document.title;
const BACK = `<a class="back" href="#" data-back>&lsaquo; Back to board</a>`;
history.scrollRestoration = "manual";
const logs = new Map(), waiting = new Map(), mates = new Map();   // mates: id -> [[teammate, name, position, runs]]
window.SCBOARD = { player(d) { const id = String(d.id); mates.set(id, d.mates || []); waiting.get(id)?.(d.games); waiting.delete(id); } };
function loadLog(id) {
  if (!logs.has(id)) {
    logs.set(id, new Promise((resolve, reject) => {
      waiting.set(id, resolve);
      const s = document.createElement("script");
      s.src = `p/${D.league}/${id}.js`;
      s.onerror = () => { logs.delete(id); reject(new Error("no game log")); };
      document.head.append(s);
    }));
  }
  return logs.get(id);
}

let view = null;        // {id, stat, line, side, win, venue, rest, mates} while a player page is open
let games = null;       // that player's log
let boardScroll = 0;
function openPlayer(row) {
  if (row.id == null) return;   // no game log to show
  const params = new URLSearchParams({ p: row.id });
  if (row.stat) { params.set("stat", row.stat); params.set("line", row.line); params.set("side", state.side); }
  // From the board this is a new history entry, so Back returns to the board. Jumping between
  // players by search replaces the entry instead, keeping the board one step back.
  if (view) history.replaceState(history.state, "", "#" + params);
  else history.pushState({ inApp: true }, "", "#" + params);
  route();
}
function syncHash() {
  const params = new URLSearchParams({ p: view.id, stat: view.stat, line: view.line, side: view.side });
  history.replaceState(history.state, "", "#" + params);
}
function route() {
  const params = new URLSearchParams(location.hash.slice(1));
  const id = params.get("p");
  tip.hidden = true;
  document.body.dataset.view = id ? "player" : "board";
  if (!id) {
    if (view) {
      view = games = null;
      page.hidden = true; page.replaceChildren(); layout.hidden = false;
      document.title = TITLE;
      scrollTo(0, boardScroll);
    }
    return;
  }
  if (!view) boardScroll = scrollY;
  view = {
    id, stat: params.get("stat"), line: params.has("line") ? +params.get("line") : null,
    side: params.get("side") === "under" ? "under" : "over", win: "l10", venue: "any", rest: "any",
    mates: [],   // [{id, mode: "with" | "without"}]: only games this teammate played in, or sat out
  };
  games = null;
  layout.hidden = true; page.hidden = false;
  page.innerHTML = `${BACK}<p class="summary">Loading game log…</p>`;
  scrollTo(0, 0);
  loadLog(id).then(log => { if (view && view.id === id) { games = log; renderPlayer(); } },
    () => { if (view && view.id === id) page.innerHTML = `${BACK}<div class="page-head"><h1 id="player-name">No game log</h1></div><p class="summary">This player has no ${esc(D.name)} games in the last two seasons, or the site was built without their file. Rebuild with <code>python -m props build</code>.</p>`; });
}
addEventListener("popstate", route);
// Back to the board: through history when we came from it, so the browser's Back and ours agree.
function goBoard() {
  if (history.state?.inApp) history.back();
  else { history.replaceState(null, "", location.pathname + location.search); route(); }
}
$("#appback").addEventListener("click", goBoard);

const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const valueOf = (G, stat, i) => (CLOCK.has(stat) ? G[stat][i] / 60 : G[stat][i] ?? 0);
// Which of a player's games a teammate also played in. runs counts from the newest game:
// so many together, so many apart, so many together...
function gamesWith(runs) {
  const together = new Set();
  let i = 0;
  runs.forEach((n, k) => { if (k % 2 === 0) for (let j = 0; j < n; j++) together.add(i + j); i += n; });
  return together;
}

function renderPlayer() {
  const G = games, p = PLAYERS.get(view.id);
  const { picks, log: logStats, minis } = kindOf(p.pos);
  const mine = D.rows.filter(r => String(r.id) === view.id);
  // his next game: from a board row if he has one, else his team's next game on the slate
  const teamGame = D.games.find(g => g.home === p.team || g.away === p.team);
  const tonight = mine[0] || (teamGame && { home: teamGame.home === p.team, start: teamGame.start, game: teamGame.key,
    opp: teamGame.home === p.team ? teamGame.away : teamGame.home });
  const opp = tonight ? tonight.opp : null;
  const all = G.date.map((_, i) => i).filter(i => state.playoffs || G.game_type[i] !== 3);   // the games in play

  if (!picks.includes(view.stat)) view.stat = mine.find(r => r.ud && picks.includes(r.stat))?.stat || picks[0];
  const posted = mine.find(r => r.ud && r.stat === view.stat) || null;
  const played = all.filter(i => G[view.stat][i] != null);   // a two-way player's days off the mound have no pitching line
  if (view.line == null || Number.isNaN(view.line)) {
    view.line = posted ? posted.line : played.length ? Math.floor(mean(played.slice(0, D.typicalGames).map(i => valueOf(G, view.stat, i)))) + 0.5 : 0.5;
  }
  syncHash();

  // teammates: everyone he has shared a game with, and the ones picked to split his games by
  const team = mates.get(view.id).map(([id, name, pos, runs]) =>
    ({ id: String(id), name, pos, together: gamesWith(runs), current: PLAYERS.get(String(id))?.team === p.team }));
  for (const t of team) t.shared = all.filter(i => t.together.has(i)).length;
  const split = view.mates.map(m => ({ ...team.find(t => t.id === m.id), mode: m.mode }));
  const mateOption = t => `<option value="${esc(t.id)}">${esc(t.name)} ${esc(posLabel(t.pos))} · ${t.shared} with, ${all.length - t.shared} without</option>`;
  const mateGroup = (label, list) => (list.length ? `<optgroup label="${esc(label)}">${list.map(mateOption).join("")}</optgroup>` : "");
  const unpicked = team.filter(t => !split.some(m => m.id === t.id));
  const mateChips = split.map(m => `<span class="mate"><b>${esc(m.name)}</b><span class="seg" role="group" aria-label="Games with or without ${esc(m.name)}">${[["with", "With"], ["without", "Without"]].map(([k, l]) => `<button type="button" data-mate="${esc(m.id)}" data-val="${k}" aria-pressed="${m.mode === k}">${l}</button>`).join("")}</span><button class="drop" type="button" data-mate="${esc(m.id)}" aria-label="Stop filtering by ${esc(m.name)}">&times;</button></span>`).join("");

  const base = played.filter(i =>
    (view.venue === "any" || (view.venue === "home") === !!G.home[i]) &&
    (!D.rest || view.rest === "any" || (view.rest === "b2b" ? G.rest[i] === 0 : G.rest[i] > 0)) &&
    split.every(m => m.together.has(i) === (m.mode === "with")));
  const windows = [
    ["l5", "Last 5", base.slice(0, 5)], ["l10", "Last 10", base.slice(0, 10)], ["l20", "Last 20", base.slice(0, 20)],
    ["s0", D.seasonLabel, base.filter(i => G.season[i] === D.season)],
    ["s1", D.prevSeasonLabel, base.filter(i => G.season[i] === D.prevSeason)],
  ];
  if (opp) windows.push(["h2h", "vs " + opp, base.filter(i => G.opponent[i] === opp)]);
  windows.push(["all", "All games", base]);
  if (!windows.some(w => w[0] === view.win)) view.win = "l10";

  const s = STATS.get(view.stat);
  const res = i => result(valueOf(G, view.stat, i), view.line, view.side);
  const tiles = windows.map(([key, label, idx]) => {
    const hits = idx.filter(i => res(i) === "hit").length, pct = idx.length ? hits / idx.length : null;
    return `<button class="tile" type="button" data-win="${key}" aria-pressed="${view.win === key}"><span>${esc(label)}</span><b>${pct == null ? "&ndash;" : Math.round(pct * 100) + "%"}</b><span>${idx.length ? `${hits} of ${idx.length}` : "no games"}</span><i><u class="${pct != null && pct < 0.5 ? "low" : ""}" style="width:${Math.round((pct || 0) * 100)}%"></u></i></button>`;
  }).join("");

  const idx = windows.find(w => w[0] === view.win)[2];
  // columns and small charts with nothing in these games (his pitching on a hitter's day) are left out
  const hasData = (k, list) => list.some(i => G[k][i] != null);
  const logCols = logStats.filter(k => hasData(k, idx));
  const miniStats = minis.filter(k => hasData(k, idx.slice(0, 30)));
  const vals = idx.map(i => valueOf(G, view.stat, i));
  const where = tonight ? `${tonight.home ? "vs" : "@"} ${tonight.opp}, ${gameTime(tonight)}${tonight.rest === 0 ? ", back-to-back" : ""}`
    : "not on the slate";
  const d = opp && D.dvp[view.stat]?.[groupOf(p.pos)]?.[opp];
  const dvpNote = d ? ` ${esc(allowedText(opp, groupOf(p.pos), s.short, d))}, ${ordinal(d[0])} lowest of ${D.teams} after adjusting for schedule.` : "";
  const ud = posted
    ? `Underdog has ${posted.line}: ${["over", "under"].filter(k => posted[k]).map(k => `${k} ${fmtOdds(posted[k])}`).join(", ")}.`
      + (posted.line !== view.line ? ` <button type="button" data-reset>Use ${posted.line}</button>` : "")
    : "Underdog has no line for this stat right now.";
  // the books on this stat, priced against the chosen site's price at the page's line
  const mk = market({ id: view.id, stat: view.stat, line: view.line, ud: posted?.line === view.line,
    over: posted?.over, under: posted?.under }, view.side);
  const offered = new Set();   // one button per line the page isn't on
  const pinText = !mk ? "" : D.books.map((b, i) => [b, mk.quotes[i]]).filter(([, q]) => q).map(([b, q]) => {
    const use = q.line === view.line || offered.has(q.line) ? ""
      : (offered.add(q.line), ` <button type="button" data-line="${q.line}">Use ${q.line}</button>`);
    return ` ${esc(b.name)} has ${q.line}: over ${fmtDec(q.over)}, ${q.oneWay ? "no under" : `under ${fmtDec(q.under)}`}.${use}`;
  }).join("") + (mk.fair == null ? ""
    : mk.est ? ` No sharp book has both sides at ${view.line}, so ${fmtPct(mk.fair)} ${view.side} is an estimate, ${esc(estNote(mk, view.side))}`
      + `${mk.ev != null ? `, ${fmtEv(mk.ev)} EV at ${targetName()}'s ${fmtDec(mk.offer)}` : ""}.`
    : ` ${mk.same > 1 ? `The best over and under at ${view.line} make it` : "That is"} ${fmtPct(mk.fair)} ${view.side} with the vig removed${mk.cap ? ` (${esc(capNote(mk))})` : ""}`
      + `${mk.ev != null ? `, ${fmtEv(mk.ev)} EV at ${targetName()}'s ${fmtDec(mk.offer)}` : ""}.`);

  const cell = (k, i) => (G[k][i] == null ? "&ndash;" : CLOCK.has(k) ? fmtClock(G[k][i]) : esc(G[k][i]));
  const logRows = idx.slice(0, 100).map(i => {
    const r = res(i);
    return `<tr><td><span class="mark ${r}">${r === "hit" ? "✓" : r === "miss" ? "✕" : "="}</span><span class="sr">${r}</span></td>
<td>${shortDate(G.date[i])}/${G.date[i].slice(2, 4)}</td><td>${G.home[i] ? "vs" : "@"} ${esc(G.opponent[i])}${G.game_type[i] === 3 ? " (PO)" : ""}</td>
${D.rest ? `<td>${G.rest[i] === 0 ? "B2B" : G.rest[i] >= 3 ? "3+" : G.rest[i]}</td>` : ""}
${logCols.map(k => `<td class="${k === view.stat ? "on" : ""}">${cell(k, i)}</td>`).join("")}</tr>`;
  }).join("");

  document.title = `${p.name} | SC Board`;
  page.innerHTML = `${BACK}
<div class="page-head">${mugHtml(view.id, p.name)}
  <div><h1 id="player-name">${esc(p.name)}</h1><p><b>${esc(tonight?.team || p.team)}</b> ${esc(posLabel(p.pos))}, ${esc(where)}</p></div>
</div>
<div>
  <div class="controls">
    <label>Stat <select data-ctl="stat">${picks.map(k => `<option value="${k}"${k === view.stat ? " selected" : ""}>${esc(STATS.get(k).label)}</option>`).join("")}</select></label>
    <label>Line <span class="stepper"><button type="button" data-step="-1" aria-label="Lower the line">&minus;</button><output>${view.line}</output><button type="button" data-step="1" aria-label="Raise the line">+</button></span></label>
    <div class="seg" role="group" aria-label="Side">${["over", "under"].map(k => `<button type="button" data-ctl="side" data-val="${k}" aria-pressed="${view.side === k}">${k === "over" ? "Over" : "Under"}</button>`).join("")}</div>
    <label>Venue <select data-ctl="venue">${[["any", "Home and away"], ["home", "Home"], ["away", "Away"]].map(([k, l]) => `<option value="${k}"${k === view.venue ? " selected" : ""}>${l}</option>`).join("")}</select></label>
    ${D.rest ? `<label>Rest <select data-ctl="rest">${[["any", "Any"], ["b2b", "Back-to-back"], ["rested", "1+ days off"]].map(([k, l]) => `<option value="${k}"${k === view.rest ? " selected" : ""}>${l}</option>`).join("")}</select></label>` : ""}
    ${team.length ? `<label>Teammate <select data-ctl="mate"><option value="">${split.length ? "Add another…" : "Choose…"}</option>${mateGroup(p.team, unpicked.filter(t => t.current))}${mateGroup("Former teammates", unpicked.filter(t => !t.current))}</select></label>` : ""}
    <button class="ghost" type="button" data-playoffs aria-pressed="${state.playoffs}">Include playoffs</button>
  </div>
  ${mateChips ? `<div class="mates">${mateChips}</div>` : ""}
  <p class="udline">${ud}${pinText}</p>
  <div class="tiles">${tiles}</div>
  <p class="summary">${vals.length ? `Averaging <b>${mean(vals).toFixed(2)}</b> ${esc(s.label.toLowerCase())} over these ${vals.length} games, median <b>${fmtNum(median(vals))}</b>.` : ""}${dvpNote}</p>
  <div id="mainchart"></div>
  <div class="minis">${miniStats.map(k => `<div><h3>${esc(STATS.get(k).label)} <small data-mean="${k}"></small></h3><div data-mini="${k}"></div></div>`).join("")}</div>
  <div class="logwrap"><h3>Game log${idx.length > 100 ? ", latest 100" : ""}</h3>
    <div class="logscroll"><table class="log"><thead><tr><th><span class="sr">Result</span></th><th>Date</th><th>Opp</th>${D.rest ? "<th>Rest</th>" : ""}${logCols.map(k => `<th class="${k === view.stat ? "on" : ""}">${esc(STATS.get(k).short)}</th>`).join("")}</tr></thead><tbody>${logRows}</tbody></table></div>
  </div>
</div>`;

  const shownIdx = idx.slice(0, 30).reverse();
  const point = (stat, i, cls) => {
    const v = valueOf(G, stat, i), clock = CLOCK.has(stat);
    return { v, text: clock ? fmtClock(G[stat][i]) : String(v), opp: G.opponent[i], date: G.date[i], where: G.home[i] ? "vs" : "@", cls };
  };
  drawChart($("#mainchart"), shownIdx.map(i => point(view.stat, i, "b-" + res(i))), {
    height: 280, line: view.line, caps: shownIdx.length <= 20, axis: true, whole: true, unit: s.short,
    label: `${s.label} in the selected games against a line of ${view.line}`,
  });
  for (const k of miniStats) {
    const pts = shownIdx.filter(i => G[k][i] != null).map(i => point(k, i, "b-plain"));
    const clock = CLOCK.has(k), avg = pts.length ? mean(pts.map(x => x.v)) : null;
    $(`[data-mean="${k}"]`).textContent = avg == null ? "" : `avg ${clock ? fmtClock(Math.round(avg * 60)) : avg.toFixed(1)}`;
    drawChart($(`[data-mini="${k}"]`), pts, { height: 110, mean: avg, whole: !clock, unit: clock ? "min" : STATS.get(k).short, label: STATS.get(k).label });
  }
}
page.addEventListener("change", e => {
  const ctl = e.target.dataset.ctl; if (!ctl || !games) return;
  if (ctl === "mate") view.mates.push({ id: e.target.value, mode: "without" });   // the usual question: how does he do when this one sits?
  else view[ctl] = e.target.value;
  if (ctl === "stat") view.line = null;
  renderPlayer();
});
page.addEventListener("click", e => {
  if (e.target.closest("[data-back]")) {
    e.preventDefault();
    goBoard();
    return;
  }
  if (!games) return;
  const t = e.target.closest("[data-step],[data-win],[data-reset],[data-line],[data-ctl='side'],[data-mate],[data-playoffs]"); if (!t) return;
  if (t.dataset.step) view.line += +t.dataset.step;
  else if ("playoffs" in t.dataset) togglePlayoffs();   // one setting for the board and every player's page
  else if (t.dataset.win) view.win = t.dataset.win;
  else if (t.dataset.line) view.line = +t.dataset.line;   // a book's line
  else if (t.dataset.ctl) view.side = t.dataset.val;
  else if (t.dataset.mate) {   // With, Without, or no value: the remove button
    const mode = t.dataset.val;
    view.mates = view.mates.flatMap(m => (m.id !== t.dataset.mate ? [m] : mode ? [{ id: m.id, mode }] : []));
  }
  else view.line = null;
  renderPlayer();
});
let resizeTimer;
addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (games) renderPlayer(); }, 150);
});

/* ---------- refresh Underdog lines in the browser ---------- */
// Underdog's API allows cross-origin requests, so the page can fetch lines itself: no server needed.
// Hit rates carry over for lines that haven't moved; a moved or new line is recomputed from the
// player's game log file, with the same rules the build uses.
const NAME_SUFFIXES = new Set(["jr", "sr", "ii", "iii", "iv"]);
const GIVEN_NAMES = { tommy: "thomas", tom: "thomas" };   // mirrors _GIVEN in underdog.py
const normName = s => {
  const parts = fold(s || "").replace(/\./g, "").replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(w => w && !NAME_SUFFIXES.has(w));
  if (parts.length > 1) parts[0] = GIVEN_NAMES[parts[0]] || parts[0];
  return parts.join(" ");
};

// A column at one of the league's set lines is that line's own stat (rush + rec TDs at 1.5 is 2+ TDs), as underdog.fixed_stat
const fixedStat = (U, stat, line) => Object.entries(U.fixed || {}).find(([, [column, at]]) => column === stat && at === line)?.[0] || stat;

function parseLines(payload, U) {
  const byId = list => new Map((list || []).map(x => [x.id, x]));
  const players = byId(payload.players), appearances = byId(payload.appearances), matches = byId(payload.games);
  const team = code => { code = code.trim().toUpperCase(); return U.teams[code] || code; };
  const lines = [];
  for (const ln of payload.over_under_lines || []) {
    if (ln.status !== "active" || (ln.line_type || "balanced") !== "balanced") continue;
    const stat = ln.over_under?.appearance_stat || {}, app = appearances.get(stat.appearance_id) || {};
    const player = players.get(app.player_id), match = matches.get(app.match_id);
    if (!player || !match || player.sport_id !== U.sport || !(match.title || "").includes(" @ ") || !(stat.stat in U.stats)) continue;
    const offers = {};
    for (const o of ln.options || []) {
      const side = { higher: "over", lower: "under" }[o.choice];
      if (side && o.status === "active") offers[side] = { odds: o.odds?.fantasy?.decimal ? +o.odds.fantasy.decimal : null, mult: +(o.payout_multiplier || 1) };
    }
    if (!offers.over && !offers.under) continue;
    const [away, home] = match.title.split(" @ ").map(team), atHome = app.team_id === match.home_team_id;
    lines.push({
      name: `${player.first_name || ""} ${player.last_name || ""}`.trim(), position: player.position_name,
      team: atHome ? home : away, opp: atHome ? away : home, home: atHome, away, homeTeam: home,
      stat: fixedStat(U, U.stats[stat.stat], +ln.stat_value), line: +ln.stat_value, over: offers.over || null, under: offers.under || null,
      start: match.scheduled_at,
    });
  }
  return lines.filter(l => slateDate(l.start) >= D.date);
}

// Hit rates for one line from a player's log (columns, newest first), with playoff games only when asked.
function lineStats(G, stat, line, opp, playoffs) {
  const idx = (G[stat] || []).map((v, i) => (v == null || (!playoffs && G.game_type[i] === 3) ? -1 : i)).filter(i => i >= 0);
  const vals = idx.map(i => G[stat][i]);
  const tallyOf = v => [v.filter(x => x > line).length, v.filter(x => x < line).length, v.length];
  const where = test => tallyOf(idx.filter(test).map(i => G[stat][i]));
  return {
    l5: tallyOf(vals.slice(0, 5)), l10: tallyOf(vals.slice(0, 10)), l20: tallyOf(vals.slice(0, 20)),
    season: where(i => G.season[i] === D.season), h2h: where(i => G.opponent[i] === opp),
    avg: vals.length ? Math.round(mean(vals.slice(0, 10)) * 100) / 100 : null,
    last: vals.slice(0, 10).reverse(),
  };
}

async function applyLines(lines, fetched, progress) {
  const keyOf = (id, name, stat) => (id ?? name) + "|" + stat;
  const current = new Map(D.rows.map(r => [keyOf(r.id, r.name, r.stat), r]));
  // who is who: the names Underdog used last time, then exact names from the player index
  const known = new Map(), indexed = new Map(), rest = new Map();
  for (const r of D.rows) {
    if (r.ud && r.id != null) known.set(normName(r.name) + "|" + r.team, r.id);
    if (r.rest !== undefined) rest.set(r.team + "|" + r.game, r.rest);
  }
  for (const [id, name, team] of D.players) (indexed.get(normName(name)) || indexed.set(normName(name), []).get(normName(name))).push({ id, team });
  const findId = (name, team) => {
    const same = indexed.get(normName(name)) || [];
    return known.get(normName(name) + "|" + team) ?? (same.find(p => p.team === team) || same[0])?.id ?? null;
  };
  const positionOf = name => Object.keys(D.positions).find(code => code === name || D.positions[code][0] === name) || "";

  const rows = [], taken = new Set(), stale = [];
  for (const ln of lines) {
    const id = findId(ln.name, ln.team), key = keyOf(id, ln.name, ln.stat), before = current.get(key);
    const pos = PLAYERS.get(String(id))?.pos || positionOf(ln.position);
    const game = `${slateDate(ln.start)}|${ln.away}@${ln.homeTeam}`;
    const row = {
      id, name: ln.name, team: ln.team, opp: ln.opp, home: ln.home, pos, start: ln.start, game,
      stat: ln.stat, line: ln.line, ud: true, over: ln.over, under: ln.under,
      dvp: D.dvp[ln.stat]?.[groupOf(pos)]?.[ln.opp]?.[0] ?? null,
    };
    if (D.rest) row.rest = rest.get(ln.team + "|" + game) ?? null;
    if (before && before.line === ln.line && before.opp === ln.opp) {
      for (const k of ["l5", "l10", "l20", "season", "h2h", "avg", "last", "po"]) if (k in before) row[k] = before[k];
    } else if (id != null) stale.push(row);
    rows.push(row); taken.add(key);
  }
  for (const r of D.rows) if (!r.ud && !taken.has(keyOf(r.id, r.name, r.stat))) rows.push(r);   // typical lines Underdog still doesn't cover

  let done = 0;
  await Promise.all(stale.map(row => loadLog(String(row.id)).then(G => {
    Object.assign(row, lineStats(G, row.stat, row.line, row.opp, false), { po: lineStats(G, row.stat, row.line, row.opp, true) });
    const lastTen = playoffs => G.date.map((d, i) => [d, G.opponent[i]]).filter((_, i) => playoffs || G.game_type[i] !== 3).slice(0, 10).reverse();
    D.recent[row.id] ??= lastTen(false);
    D.recentPo[row.id] ??= lastTen(true);
  }, () => { /* no game log: the row shows without history */ }).finally(() => progress?.(++done, stale.length))));

  const counts = new Map(), standard = new Map();
  for (const r of rows) {
    if (!r.ud) continue;
    counts.set(r.game, (counts.get(r.game) || 0) + 1);
    for (const offer of [r.over, r.under]) if (offer?.mult === 1 && offer.odds) standard.set(offer.odds, (standard.get(offer.odds) || 0) + 1);
    if (!D.games.some(g => g.key === r.game)) {
      const [date, matchup] = r.game.split("|"), [away, home] = matchup.split("@");
      D.games.push({ key: r.game, date, away, home, start: r.start, state: "upcoming", lines: 0 });
    }
  }
  for (const g of D.games) g.lines = counts.get(g.key) || 0;
  D.games.sort((a, b) => a.start.localeCompare(b.start));
  D.rows = rows;
  D.standardOdds = [...standard].sort((a, b) => b[1] - a[1])[0]?.[0] ?? null;
  D.lines = { fetched, error: null };
  renderStatus(); renderTabs(); renderGames(); renderBoard();
  if (view && games) renderPlayer();
}

const refreshButton = $("#refresh");
refreshButton.addEventListener("click", async () => {
  refreshButton.disabled = true; refreshButton.classList.add("busy");
  $("#status").textContent = "Fetching Underdog lines…";
  try {
    // Every league at once. This page's lines are applied now; the others are saved, and
    // each league's page picks its own up when it is next opened.
    const leagues = Object.keys(D.underdog), fetched = new Date().toISOString();
    const answers = await Promise.allSettled(leagues.map(async key => {
      const response = await fetch(D.underdog[key].url, { headers: { Accept: "application/json" } });
      if (!response.ok) throw new Error(`Underdog answered ${response.status}`);
      return parseLines(await response.json(), D.underdog[key]);
    }));
    answers.forEach((answer, i) => {
      if (answer.status === "fulfilled") prefs.set("lines." + leagues[i], { fetched, date: D.date, lines: answer.value });
    });
    const mine = answers[leagues.indexOf(D.league)];
    if (mine.status === "rejected") throw mine.reason;
    await applyLines(mine.value, fetched, (n, total) => { $("#status").textContent = `Reading game logs ${n}/${total}`; });
  } catch (error) {
    D.lines = { ...D.lines, error: error.message };
    renderStatus();
  } finally {
    refreshButton.disabled = false; refreshButton.classList.remove("busy");
  }
});

// Lines refreshed earlier today outlive a reload, as long as they are newer than the build's.
function restoreLines() {
  const saved = prefs.get("lines." + D.league, null);
  if (saved && saved.date === D.date && Date.parse(saved.fetched) > (D.lines.fetched ? Date.parse(D.lines.fetched) : 0)) applyLines(saved.lines, saved.fetched);
}

/* ---------- start ---------- */
renderNav(); renderStatus(); renderTabs(); renderGames(); renderBoard(); route(); restoreLines();
// Lines from an earlier slate (the build ran before Underdog posted today's, or reused a stale copy)
// are of no use on today's board: fetch today's as the Refresh button would.
{
  const times = [D.lines.fetched, prefs.get("lines." + D.league, null)?.fetched].filter(Boolean);
  const latest = times.length ? new Date(Math.max(...times.map(t => Date.parse(t)))).toISOString() : null;
  if (!latest || slateDate(latest) < D.date) refreshButton.click();
}
})();
</script>
</body>
